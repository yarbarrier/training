<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de 8 semanas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#5d6572;--ac:#e8590c;--ac2:#fff;--bd:#e2e5ea;--ok:#2b9348;--bad:#d9480f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mu:#9aa3b0;--ac:#ff7a33;--ac2:#14171c;--bd:#2a2f38;--ok:#4cc96b;--bad:#ff8a4c}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mu:#9aa3b0;--ac:#ff7a33;--ac2:#14171c;--bd:#2a2f38;--ok:#4cc96b;--bad:#ff8a4c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:8px 0 2px}
.sub{color:var(--mu);margin:0 0 12px}
.nav,.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nav button,.tab{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.nav button{flex:1}
.nav button.on,.tab.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:1.2rem}
.bar{height:8px;background:var(--bd);border-radius:8px;margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.mu{color:var(--mu);font-size:.9rem}
ul{list-style:none;margin:10px 0 0;padding:0}
li{border-top:1px solid var(--bd)}
label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:0 0 auto}
.t{flex:1}.t b{display:block}.t span{color:var(--mu);font-size:.92rem}
.k{color:var(--ac);font-weight:600;font-size:.9rem;white-space:nowrap}
li.done .t b{text-decoration:line-through;color:var(--mu)}
li.cardio .t b::before{content:"🏃 "}
.btn{display:block;width:100%;margin-top:14px;background:var(--ok);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.btn.off{background:none;border:1px solid var(--bd);color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:1.3rem}
.big{font-size:1.5rem;font-weight:800}
.good{color:var(--ok)}.warn{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=number]{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
input.n{flex:0 0 96px}
.add{border:0;background:var(--ac);color:var(--ac2);border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
.x{background:none;border:0;color:var(--mu);font-size:1.1rem;cursor:pointer;padding:4px 8px}
select{width:100%;margin-top:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
.fi{display:flex;align-items:center;gap:8px;padding:10px 2px}.fi span{flex:1}
.note{color:var(--mu);font-size:.85rem;margin-top:16px}
.rules li{padding:10px 2px}.rules li b{color:var(--ac)}
h3{margin:22px 0 0;font-size:1.05rem}
</style>
</head>
<body>
<main>
<h1>Plan de 8 semanas 💪</h1>
<p class="sub">Entreno, calorías y registro en un solo lugar</p>
<div class="nav" id="nav"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</main>
<script>
var D=[
{n:"Lun",e:"🔥",t:"Empuje + brazos",x:[["Flexiones","4 x 8-15",35],["Flexiones diamante","3 x 8-12",25],["Flexiones pike","3 x 8-12",25],["Fondos de tríceps en silla","3 x 10-15",25],["Extensión de tríceps sobre la cabeza (botella o mochila)","3 x 10-12",20],["Elevaciones laterales","3 x 12-15",15],["Plancha","3 x 30-45 s",15]],c:["30 min suave: caminata rápida, trote ligero o cuerda",200]},
{n:"Mar",e:"🦵",t:"Pierna",x:[["Sentadillas con mochila cargada","4 x 15-20",60],["Zancadas","3 x 12 por pierna",45],["Sentadilla búlgara","3 x 10 por pierna",40],["Puente de glúteos","3 x 15-20",30],["Elevación de talones","4 x 20",20]],c:["25 min suave",170]},
{n:"Mié",e:"🧗",t:"Tirón + bíceps + core",x:[["Remo invertido bajo una mesa","4 x 8-12",45],["Remo inclinado con mochila","3 x 12",35],["Superman","3 x 12",15],["Curl de bíceps con botellas","3 x 10-15",25],["Curl martillo","3 x 10-12",20],["Plancha lateral","3 x 30 s por lado",15]],c:["30 min suave",200]},
{n:"Jue",e:"⚡",t:"HIIT + abdomen",x:[["Circuito x 5 rondas: sentadilla con salto, mountain climbers, burpees y jumping jacks","30 s cada uno, 30 s de descanso",220],["Elevación de piernas","3 x 12",20],["Crunch","3 x 15",20]],c:null},
{n:"Vie",e:"🏆",t:"Cuerpo completo + brazos",x:[["Circuito x 4 rondas: flexiones x 10, sentadilla con mochila x 15, zancadas x 10 por pierna, remo invertido x 10, plancha 40 s","Descansa 1-2 min entre rondas",200],["Curl martillo","2 x 12",15],["Patada de tríceps","2 x 12",15]],c:["25 min suave",170]},
{n:"Sáb",e:"🚶",t:"Caminata larga",x:[],c:["45-60 min caminando (o trote suave si te sientes bien)",250]},
{n:"Dom",e:"😴",t:"Descanso",x:[["Estiramientos y tus pasos normales","Aquí se recupera el músculo",30]],c:null}
];
var FOODS=[['Huevo cocido','unidad',75,6.5,2],['Huevo frito','unidad',95,6.3,2],['Arepa de maíz','unidad',150,3,1],['Pan tajado','unidad',80,3,2],['Avena en hojuelas (seca)','g',380,13,40],['Arroz blanco cocido','g',130,2.7,150],['Pasta cocida','g',158,5.8,200],['Pechuga de pollo a la plancha','g',165,31,150],['Carne de res magra','g',230,26,120],['Pescado (tilapia)','g',130,26,150],['Atún en agua','g',116,26,120],['Frijoles cocidos','g',130,8.7,150],['Lentejas cocidas','g',116,9,150],['Yuca cocida','g',160,1.4,150],['Papa cocida','g',87,2,150],['Plátano maduro frito','g',250,1.2,100],['Plátano verde cocido','g',120,1,100],['Aguacate','g',160,2,60],['Queso fresco','g',270,18,40],['Leche entera','ml',62,3.2,250],['Yogur griego natural','g',80,10,170],['Banano','unidad',105,1.3,1],['Manzana','unidad',80,0.4,1],['Naranja','unidad',62,1.2,1],['Mantequilla de maní','g',590,25,15],['Maní','g',567,26,30],['Empanada','unidad',250,6,1],['Pizza (porción)','unidad',285,12,1],['Jugo de fruta con azúcar','ml',50,0.3,250],['Gaseosa','ml',42,0,350],['Aceite (cucharada)','unidad',120,0,1],['Proteína whey (scoop)','unidad',120,24,1]],MEALS=['🌅 Desayuno','🍲 Almuerzo','🌙 Cena','🍎 Snack'],meal=(function(h){return h<10?0:h<15?1:h<18?3:2})(new Date().getHours());
var NM=["Entreno","Comida","Registro"],MS=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
var sel=(new Date().getDay()+6)%7,view=0,st={ck:{},food:{},day:{},log:{},base:2100};
function ld(){try{var s=JSON.parse(localStorage.getItem("plan8v2")||"null");if(s){st=s;st.ck=st.ck||{};st.food=st.food||{};st.day=st.day||{};st.log=st.log||{};st.base=st.base||2100}}catch(e){}}
function sv(){try{localStorage.setItem("plan8v2",JSON.stringify(st))}catch(e){}}
function p2(n){return(n<10?"0":"")+n}
function iso(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
var wo=0;
function dateOf(i,o){var t=new Date(),w=(t.getDay()+6)%7;if(o===undefined)o=wo;return iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-w+i+7*o))}
function sd(s){var a=s.split('-');return(+a[2])+' '+MS[+a[1]-1]}
function wkbar(){return `<div class='row' style='align-items:center;margin:4px 0 8px'><button class='add' data-w='-1' aria-label='Semana anterior'>‹</button><div class='mu' style='flex:1;text-align:center'><b>${wo==0?'Esta semana · ':''}${sd(dateOf(0))} – ${sd(dateOf(6))}</b>${wo!=0?`<br><a href='#' data-w='0' style='color:var(--ac)'>Ir a esta semana</a>`:''}</div><button class='add' data-w='1' aria-label='Semana siguiente'>›</button></div>`}
function idxOf(s){var a=s.split("-");return(new Date(+a[0],+a[1]-1,+a[2]).getDay()+6)%7}
function lbl(s){var a=s.split("-");return D[idxOf(s)].n+" "+(+a[2])+" "+MS[+a[1]-1]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return Math.round(n).toLocaleString("es")}
function items(i){var d=D[i],a=d.x.map(function(x){return{t:x[0],s:x[1],k:x[2],c:0}});if(d.c)a.push({t:"Cardio",s:d.c[0],k:d.c[1],c:1});return a}
function burn(s){var a=items(idxOf(s)),b=0;a.forEach(function(it,i){if(st.ck[s+"_"+i])b+=it.k});return b}
function eaten(s){var d=st.day&&st.day[s];return d?(d.k||0):(st.food[s]||[]).reduce(function(a,x){return a+x.k},0)}
function prot(s){var d=st.day&&st.day[s];return d?(d.p||0):(st.food[s]||[]).reduce(function(a,x){return a+(x.p||0)},0)}
function bal(s){return eaten(s)-(st.base+burn(s))}
function sgn(n){return(n>0?"+":n<0?"−":"")+f(Math.abs(n))}
function nav(){var h="";NM.forEach(function(n,i){h+='<button data-v="'+i+'" class="'+(i==view?'on':'')+'">'+n+'</button>'});var e=document.getElementById("nav");e.innerHTML=h;e.onclick=function(ev){var b=ev.target.closest("button");if(b){view=+b.dataset.v;render()}}}
function tabs(){var e=document.getElementById("tabs");if(view==2){e.innerHTML="";return}var h="";D.forEach(function(d,i){h+='<button class="tab'+(i==sel?' on':'')+'" data-i="'+i+'">'+d.n+'</button>'});e.innerHTML=h;e.onclick=function(ev){var b=ev.target.closest(".tab");if(b){sel=+b.dataset.i;render()}}}
function vTrain(){var s=dateOf(sel),d=D[sel],a=items(sel),n=0,h="";
a.forEach(function(it,i){var k=s+"_"+i,on=!!st.ck[k];if(on)n++;h+='<li class="'+(on?'done ':'')+(it.c?'cardio':'')+'"><label><input type="checkbox" data-k="'+k+'"'+(on?' checked':'')+'><div class="t"><b>'+esc(it.t)+'</b><span>'+esc(it.s)+'</span></div><div class="k">≈'+it.k+' kcal</div></label></li>'});
var p=a.length?Math.round(n/a.length*100):0,lg=!!st.log[s];
return '<div class="card"><h2>'+d.e+' '+d.t+'</h2><div class="mu">'+lbl(s)+' · '+n+' de '+a.length+' completados</div><div class="bar"><i style="width:'+p+'%"></i></div><ul>'+h+'</ul><div class="grid"><div class="stat"><span class="mu">Quemado en ejercicio</span><b>'+f(burn(s))+' kcal</b></div><div class="stat"><span class="mu">Comido hoy</span><b>'+f(eaten(s))+' kcal</b></div></div>'+(lg?'<button class="btn off" id="lg">✓ Día registrado · toca para quitar</button>':'<button class="btn" id="lg">✅ Registrar este día como hecho</button>')+'</div><p class="note">Las calorías son estimaciones para ≈76 kg. Úsalas como guía, no como número exacto.</p>'}
function fd(n){n=n.trim().toLowerCase();for(var i=0;i<FOODS.length;i++)if(FOODS[i][0].toLowerCase()==n)return FOODS[i];return null}
function mu(x){return x[1]=='unidad'?1:0.01}
function calc(ev){var id=ev.target.id;if(id!='fn'&&id!='fq')return;var x=fd(document.getElementById('fn').value),q=document.getElementById('fq');if(!x)return;if(id=='fn')q.value=x[4];document.getElementById('un').textContent=x[1];document.getElementById('fk').value=Math.round((parseFloat(q.value)||0)*x[2]*mu(x))}
function vFood(){var s=dateOf(sel),d=(st.day&&st.day[s])||{},e=eaten(s),b=burn(s),t=st.base+b,bl=e-t,pr=prot(s);
var res=e>0?`<div class='big ${bl<=0?'good':'warn'}'>${sgn(bl)} kcal</div><div class='mu'>${bl<=0?'Déficit del día: ≈'+(Math.abs(bl)/7.7).toFixed(0)+' g de grasa':'Superávit del día: comiste más de lo que gastas'}</div>`:`<div class='mu'>Anota lo que comiste para ver tu balance.</div>`;
return `<div class='card'><h2>🍽 Comida · ${lbl(s)}</h2><div class='grid'><div class='stat'><span class='mu'>Comido</span><b>${f(e)} kcal</b></div><div class='stat'><span class='mu'>Gastado (base + ejercicio)</span><b>${f(t)} kcal</b></div><div class='stat'><span class='mu'>Proteína</span><b>${f(pr)} / 140 g</b></div><div class='stat'><span class='mu'>Ejercicio</span><b>${f(b)} kcal</b></div></div><div style='margin-top:12px'>${res}</div></div><div class='card'><h2>¿Cuánto comiste este día?</h2><div class='mu'>Anota el total de calorías y de proteína. Si te equivocas, cámbialo y guarda otra vez.</div><div class='row'><input type='number' id='dk' placeholder='Calorías (ej: 1500)' value='${d.k!=null?d.k:''}' inputmode='numeric' min='0'><input type='number' id='dp' placeholder='Proteína (g)' value='${d.p!=null?d.p:''}' inputmode='numeric' min='0'></div><button class='btn' id='ds' style='background:var(--ac);color:var(--ac2)'>Guardar</button></div><div class='card'><h2>Tu gasto base</h2><div class='mu'>Lo que quemas en un día sin entrenar. Para ti ronda 2,100 kcal.</div><div class='row'><input type='number' id='bs' value='${st.base}' inputmode='numeric' min='1000' max='4000'><button class='add' id='bsb'>Guardar</button></div></div><p class='note'>Meta: unas 1,900-2,100 kcal y 130-150 g de proteína.</p>`}
function vFoodOld2(){var s=dateOf(sel),l=st.food[s]||[],e=eaten(s),b=burn(s),t=st.base+b,bl=e-t,pr=prot(s),h='';
MEALS.forEach(function(mn,mi){var sub=0,r='';l.forEach(function(x,i){if((x.m||0)!=mi)return;sub+=x.k;r+=`<div class='fi'><span>${esc(x.n)}${x.q?`<br><span class='mu'>${x.q} ${x.u}${x.p?' · '+x.p+' g prot':''}</span>`:''}</span><b>${f(x.k)} kcal</b><button class='x' data-d='${i}' aria-label='Borrar'>✕</button></div>`});if(r)h+=`<div class='mu' style='padding-top:12px'><b>${mn}</b> · ${f(sub)} kcal</div>${r}`});
var res=e>0?`<div class='big ${bl<=0?'good':'warn'}'>${sgn(bl)} kcal</div><div class='mu'>${bl<=0?'Déficit del día: ≈'+(Math.abs(bl)/7.7).toFixed(0)+' g de grasa':'Superávit del día: comiste más de lo que gastas'}</div>`:`<div class='mu'>Agrega lo que comiste para ver tu balance.</div>`;
var opts=FOODS.map(function(x){return `<option value='${x[0]}'>`}).join(''),mo=MEALS.map(function(m,i){return `<option value='${i}'${i==meal?' selected':''}>${m}</option>`}).join('');
return `<div class='card'><h2>🍽 Comida · ${lbl(s)}</h2><div class='grid'><div class='stat'><span class='mu'>Comido</span><b>${f(e)} kcal</b></div><div class='stat'><span class='mu'>Gastado (base + ejercicio)</span><b>${f(t)} kcal</b></div><div class='stat'><span class='mu'>Proteína</span><b>${f(pr)} / 140 g</b></div><div class='stat'><span class='mu'>Ejercicio</span><b>${f(b)} kcal</b></div></div><div style='margin-top:12px'>${res}</div></div><div class='card'><h2>Agregar comida</h2><div class='mu'>Elige de la lista y pon la cantidad: las calorías se calculan solas. También puedes escribir otra comida y sus kcal.</div><div class='row'><input type='text' id='fn' list='fl' placeholder='Ej: Arroz blanco cocido' maxlength='60' autocomplete='off'><datalist id='fl'>${opts}</datalist></div><div class='row'><input type='number' id='fq' placeholder='Cantidad' inputmode='decimal' min='0'><span id='un' class='mu' style='align-self:center;min-width:46px'></span><input type='number' class='n' id='fk' placeholder='kcal' inputmode='numeric' min='0'></div><select id='fm'>${mo}</select><button class='btn' id='fa' style='background:var(--ac);color:var(--ac2)'>Agregar</button>${h}</div><div class='card'><h2>Tu gasto base</h2><div class='mu'>Lo que quemas en un día sin entrenar. Para ti ronda 2,100 kcal.</div><div class='row'><input type='number' id='bs' value='${st.base}' inputmode='numeric' min='1000' max='4000'><button class='add' id='bsb'>Guardar</button></div></div><p class='note'>Meta: unas 1,900-2,100 kcal y 130-150 g de proteína.</p>`}
function vFoodOld(){var s=dateOf(sel),l=st.food[s]||[],h="",e=eaten(s),b=burn(s),t=st.base+b,bl=e-t,has=e>0;
l.forEach(function(x,i){h+='<div class="fi"><span>'+esc(x.n)+'</span><b>'+f(x.k)+' kcal</b><button class="x" data-d="'+i+'" aria-label="Borrar">✕</button></div>'});
var res=has?'<div class="big '+(bl<=0?'good':'warn')+'">'+sgn(bl)+' kcal</div><div class="mu">'+(bl<=0?'Déficit del día: ≈'+(Math.abs(bl)/7.7).toFixed(0)+' g de grasa':'Superávit del día: estás por encima de lo que gastas')+'</div>':'<div class="mu">Agrega lo que comiste para ver tu balance.</div>';
return '<div class="card"><h2>🍽 Comida · '+lbl(s)+'</h2><div class="grid"><div class="stat"><span class="mu">Comido</span><b>'+f(e)+'</b></div><div class="stat"><span class="mu">Gastado (base + ejercicio)</span><b>'+f(t)+'</b></div></div><div style="margin-top:12px">'+res+'</div></div><div class="card"><h2>Agregar alimento</h2><div class="row"><input type="text" id="fn" placeholder="Ej: arroz con pollo" maxlength="60"><input type="number" class="n" id="fk" placeholder="kcal" inputmode="numeric" min="0"></div><button class="btn" id="fa" style="background:var(--ac);color:var(--ac2)">Agregar</button>'+h+'</div><div class="card"><h2>Tu gasto base</h2><div class="mu">Lo que quemas en un día sin entrenar. Para ti ronda 2,100 kcal.</div><div class="row"><input type="number" id="bs" value="'+st.base+'" inputmode="numeric" min="1000" max="4000"><button class="add" id="bsb">Guardar</button></div></div><p class="note">Meta: comer unas 1,900-2,100 kcal y 130-150 g de proteína.</p>'}
function vLog(){var ds=Object.keys(st.log).filter(function(k){return st.log[k]}).sort().reverse(),t=new Date(),w=(t.getDay()+6)%7,wk=0,h="",tb=0,nd=0;
ds.forEach(function(s){if(s>=dateOf(0,0)&&s<=dateOf(6,0))wk++;var e=eaten(s),b=burn(s),bl=e?bal(s):null;if(bl!==null){tb+=bl;nd++}
h+='<li><div class="fi"><span><b>'+lbl(s)+'</b> · '+D[idxOf(s)].t+'<br><span class="mu">🔥 '+f(b)+' quemadas · 🍽 '+f(e)+' comidas</span></span><b class="'+(bl===null?'':bl<=0?'good':'warn')+'">'+(bl===null?'—':sgn(bl))+'</b></div></li>'});
